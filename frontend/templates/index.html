<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Posts</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    <div class="container">
        <h1>📚 Blog Posts</h1>
        <div class="input-field">
            <label for="api-base-url"></label><input type="text" id="api-base-url" placeholder="Enter API Base URL" value="http://127.0.0.1:5002/api">
            <button onclick="loadPosts()">Load Posts</button>
        </div>
        <div class="input-field">
            <label for="post-search"></label><input type="text" id="post-search" placeholder="Search">
        </div>
        <div class="input-field">
            <label for="post-title"></label><input type="text" id="post-title" placeholder="Enter Post Title">
            <label for="post-content"></label><input type="text" id="post-content" placeholder="Enter Post Content">
            <label for="post-author"></label><input type="text" id="post-author" placeholder="Enter an Author">
            <button onclick="addPost()">Add Post</button>
        </div>
        <div id="sort" class="input-field">
            <div>Sort by:</div>
            <div>
                <button type="button" onclick="sortPosts('title')">Title</button>
            </div>
            <div>
                <button type="button" onclick="sortPosts('author')">Author</button>
            </div>
        </div>
        <div id="post-container">
            <!-- Blog posts will be inserted here by JavaScript -->
        </div>
    </div>

    <script src="../static/main.js"></script>
</body>
</html>
