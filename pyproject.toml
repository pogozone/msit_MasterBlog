[project]
name = "msit-masterblog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Woldt", email = "geist@emaz.de" }
]
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
]

[project.scripts]
msit-masterblog = "msit_masterblog:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flask-cors>=6.0.5",
    "pytest>=9.1.1",
]
